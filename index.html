<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星曜對照簿｜紫微斗數學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<script src="iztro.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5B3E8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星曜對照簿">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">星曜對照簿 <small>紫微斗數學習用</small></div>
    <nav>
      <button data-view="compare" aria-current="true">對照</button>
      <button data-view="chart">命盤</button>
      <button data-view="notes">筆記</button>
      <button data-view="people">朋友</button>
    </nav>
  </div>
</header>

<div class="banner" id="backupBanner" hidden role="status">
  <span class="msg"></span>
  <span class="acts"><button class="btn primary" id="backupNow">立即備份</button><button class="btn" id="backupLater">明天再提醒</button></span>
</div>
<main>
  <!-- 對照 -->
  <section class="view on" id="v-compare">
    <div class="controls">
      <div class="seg" role="group" aria-label="對照方式">
        <button data-mode="star" aria-pressed="true">以星找宮</button>
        <button data-mode="palace" aria-pressed="false">以宮看星</button>
        <button data-mode="event" aria-pressed="false">以事件看</button>
      </div>
      <select id="starSel" aria-label="選擇星曜"></select>
      <select id="palSel" aria-label="選擇宮位" hidden></select>
      <select id="evCatSel" aria-label="事件類別" hidden></select>
      <span class="layerctl" id="layerCtl">
        <select id="layerSel" aria-label="盤層">
          <option value="natal">本命盤</option>
          <option value="decadal">大限盤</option>
          <option value="yearly">流年盤</option>
        </select>
        <label class="yearpick" id="yearPick" hidden><input type="number" id="cYear" min="1900" max="2100" aria-label="年份"> 年</label>
      </span>
    </div>
    <div id="compareOut"></div>
  </section>

  <!-- 命盤 -->
  <section class="view" id="v-chart">
    <div class="controls">
      <select id="personSel" aria-label="選擇朋友"></select>
      <select id="partnerSel" aria-label="合盤對象"></select>
      <button class="btn" id="swapBtn" type="button" hidden title="對調兩人">⇄ 對調</button>
      <div class="seg" role="group" aria-label="顯示內容" id="detailSeg">
        <button data-detail="full">完整</button>
        <button data-detail="simple">精簡</button>
      </div>
      <span class="legend">點盤上的星曜，會跳到「對照」看所有朋友的這顆星</span>
    </div>
    <div id="chartOut"></div>
  </section>

  <!-- 朋友 -->
  <section class="view" id="v-notes">
    <div class="controls">
      <div class="seg" role="group" aria-label="筆記分組">
        <button data-ngroup="star">依星曜</button>
        <button data-ngroup="palace">依宮位</button>
      </div>
      <input type="text" id="noteSearch" placeholder="搜尋筆記內容、星名、宮名" aria-label="搜尋筆記" style="flex:1;min-width:180px">
      <button class="btn" id="noteMdBtn">下載全部筆記（Markdown）</button>
    </div>
    <div id="notesOut"></div>
  </section>

  <section class="view" id="v-people">
    <div class="people">
      <div>
        <div class="plist" id="plist"></div>
        <div class="io">
          <button class="btn" id="exportBtn">匯出備份（JSON）</button>
          <label class="btn">匯入備份<input type="file" id="importFile" accept="application/json" hidden></label>
          <button class="btn" id="sampleBtn">加入兩個範例</button>
        </div>
        <div class="card settings">
          <h3>排盤設定</h3>
          <div id="settingsForm" class="settings-grid"></div>
        </div>
      </div>
      <form class="card" id="pform" autocomplete="off">
        <h3 id="formTitle">新增朋友</h3>
        <input type="hidden" id="fId">
        <label class="f">名字或代號<input type="text" id="fName" required maxlength="20"></label>
        <div class="inline">
          <label><input type="radio" name="g" value="女" checked> 女</label>
          <label><input type="radio" name="g" value="男"> 男</label>
          <span style="flex:1"></span>
          <label><input type="radio" name="cal" value="solar" checked> 國曆</label>
          <label><input type="radio" name="cal" value="lunar"> 農曆</label>
        </div>
        <label class="f">出生日期（年／月／日）
          <div class="ymd">
            <input type="number" id="fY" placeholder="1990" min="1900" max="2100" required aria-label="年">
            <input type="number" id="fM" placeholder="月" min="1" max="12" required aria-label="月">
            <input type="number" id="fD" placeholder="日" min="1" max="31" required aria-label="日">
          </div>
        </label>
        <label class="inline" id="leapWrap" hidden><input type="checkbox" id="fLeap"> 閏月</label>
        <div class="inline">
          <label><input type="radio" name="tm" value="clock" checked> 知道幾點幾分</label>
          <label><input type="radio" name="tm" value="hour"> 只知道時辰</label>
        </div>
        <div id="clockWrap" class="clockbox">
          <label class="f">出生時間（出生證明上的鐘錶時間）<input type="time" id="fClock" value="12:00"></label>
          <label class="f">出生地<select id="fPlace"></select></label>
          <div class="ymd" id="lonWrap" hidden style="grid-template-columns:1fr 1fr">
            <label class="f">經度（東經）<input type="number" id="fLon" step="0.01" placeholder="121.56"></label>
            <label class="f">時區（UTC+）<input type="number" id="fTz" step="0.5" value="8"></label>
          </div>
          <label class="inline"><input type="checkbox" id="fDst"> 當時正在實施夏令時間（日光節約時間）</label>
          <div class="hint">台灣 1945–1961、1974–1975、1979 年夏天，中國大陸 1986–1991 年夏天曾實施。不確定可以對照文墨天機的「真太陽時」。</div>
          <div class="tst" id="tstPreview"></div>
        </div>
        <label class="f" id="hourWrap" hidden>出生時辰<select id="fTime"></select></label>
        <label class="f">備註（選填）<input type="text" id="fNote" maxlength="60" placeholder="例如：個性、職業、已知事件"></label>
        <div class="err" id="fErr"></div>
        <div class="inline">
          <button class="btn primary" type="submit" id="saveBtn">儲存</button>
          <button class="btn" type="button" id="cancelBtn" hidden>取消編輯</button>
        </div>
      </form>
    </div>
  </section>
</main>
<dialog id="noteDlg" aria-labelledby="noteDlgTitle">
  <div class="dlg-head"><b id="noteDlgTitle">筆記</b><button class="btn primary" id="noteDlgClose" type="button">完成</button></div>
  <textarea id="noteDlgText" placeholder="寫下你觀察到的共通點、書上的解釋…" aria-label="筆記內容"></textarea>
  <div class="dlg-foot">輸入的內容會自動儲存。</div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
